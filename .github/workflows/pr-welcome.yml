# PR 欢迎机器人：新 PR 打开时自动回复欢迎语 + 改动统计
name: PR 欢迎机器人

# 注意：必须用 pull_request_target 而非 pull_request——fork PR 触发的
# pull_request 事件拿到的是只读 GITHUB_TOKEN，createComment 会 403，
# 导致欢迎机器人在所有 fork PR 上失败（PR #9 实测）。
# pull_request_target 在基础仓库上下文运行、令牌可写；本工作流只读
# PR 元数据发评论，不 checkout PR 代码、不使用任何 Secret，无注入风险。
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: 发送欢迎评论
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.issue.number;
            const author = context.payload.pull_request.user.login;

            // 统计改动
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: 100
            });
            let add = 0, del = 0;
            for (const f of files.data) { add += f.additions; del += f.deletions; }

            const body = [
              `## 👋 感谢贡献 CurrentCortex！`,
              '',
              `@${author}，你好！你的拉取请求 **#${number}** 已收到。`,
              '',
              `**本次改动**：${files.data.length} 个文件，+${add} / -${del}`,
              '',
              '**接下来会发生什么**',
              '1. 🤖 测试机器人会自动运行测试并反馈结果',
              '2. 🤖 AI 审查机器人会对改动做一次初步代码审查（仅供参考）',
              '3. 👀 维护者会在方便时进行人工审查',
              '',
              '期间你可以继续推送提交，机器人会自动跟进最新的改动。祝顺利合并！ 🎉'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: body
            });
