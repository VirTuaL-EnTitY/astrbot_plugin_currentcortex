name: ✨ 功能建议
description: 新功能、新命令、体验优化
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！请描述清楚「想解决什么问题」而不只是「想加什么功能」，
        这样即使实现方式有变，需求也不会丢失。
        也欢迎到 QQ 交流群 **1106353813** 一起讨论玩法。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 什么场景下觉得不方便？现有功能哪里不满足？
      placeholder: 例如：群友经常 xxx，但插件目前只能 xxx……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果
      description: 你希望插件怎么做？交互形式（命令 / 配置项 / WebUI）有什么想法？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 有没有考虑过其他做法？或用现有功能绕过的尝试。

  - type: textarea
    id: extra
    attributes:
      label: 附加信息（可选）
      description: 相关截图、其他项目的同类功能参考等。
